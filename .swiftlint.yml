included:
  - DarIA
  - Packages/DarIAUI/Sources
  - Packages/Networking/Sources

excluded:
  - Packages/DarIAUI/Sources/DarIAUI/Tokens
  - "**/.build"
  - DerivedData

opt_in_rules:
  - empty_count
  - first_where
  - closure_spacing
  - sorted_imports

line_length:
  warning: 140
  error: 200
  ignores_comments: true

identifier_name:
  min_length: 3
  excluded:
    - id
    - x
    - y

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800
