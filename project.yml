name: DarIA
options:
  bundleIdPrefix: dev.hdvillamil
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "QBYF67CS24"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DarIAData:
    path: Packages/DarIAData
  DarIAUI:
    path: Packages/DarIAUI
targets:
  DarIA:
    type: application
    platform: iOS
    sources:
      - path: DarIA
        excludes: ["**/*.md", "**/.gitkeep"]
    dependencies:
      - package: DarIAData
      - package: DarIAUI
    info:
      path: DarIA/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - PermanentMarker-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hdvillamil.daria
        INFOPLIST_KEY_CFBundleDisplayName: "DarIA"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    preBuildScripts:
      - name: SwiftLint (max 3 violations)
        script: "/bin/bash \"${SRCROOT}/scripts/lint.sh\""
        basedOnDependencyAnalysis: false
